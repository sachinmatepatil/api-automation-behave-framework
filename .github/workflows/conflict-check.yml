name: conflict-check

on:
  push:
  pull_request:

jobs:
  conflict-marker-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail if merge conflict markers exist
        run: |
          set -e
          FOUND=0
          # Scan for "<<<<<<<" markers, exclude the workflow file
          if git grep -n "<<<<<<< " -- . ':!./.github/workflows/conflict-check.yml'; then
            echo "Found conflict markers (<<<<<<<)."
            FOUND=1
          fi
          # Scan for ">>>>>>>" markers, exclude the workflow file
          if git grep -n ">>>>>>> " -- . ':!./.github/workflows/conflict-check.yml'; then
            echo "Found conflict markers (>>>>>>>)"
            FOUND=1
          fi
          if [ $FOUND -eq 1 ]; then
            exit 1
          else
            echo "No merge conflict markers found."
          fi
